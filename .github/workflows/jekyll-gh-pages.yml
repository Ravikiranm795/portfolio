name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - developer

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Application
        run: |
          npm run build -- --configuration production --base-href=/YOUR_REPOSITORY_NAME/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Build Files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/3d-portfolio/browser

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
